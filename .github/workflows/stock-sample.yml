name: Diagnose UralPlit stock extraction
on:
  push:
    branches:
      - stock-sync-prototype
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse one category page
        run: python -m scripts.stock_sample
