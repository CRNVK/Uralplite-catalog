name: Probe UralPlit stock page
on:
  workflow_dispatch:
  push:
    branches:
      - stock-sync-prototype
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl public UralPlit PVC edge catalog
        run: python scripts/sync_stock.py
      - name: Upload stock probe result
        uses: actions/upload-artifact@v4
        with:
          name: uralplit-stock-probe
          path: stock-data.json
          if-no-files-found: error
