name: Stop obsolete stock crawler runs
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-old-crawls.yml"
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel outdated validation crawls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 40875532819 40875515802 40875505523 40875453355 40876038755; do
            gh run cancel "$run_id" --repo CRNVK/Uralplite-catalog || true
          done
