name: Refresh official visual decor catalogs
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/sync_official_catalogs.py"
      - ".github/workflows/refresh-visual-catalogs.yml"
permissions:
  contents: write
concurrency:
  group: refresh-visual-catalogs
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog tools
        run: pip install requests beautifulsoup4 pillow
      - name: Sync official decor pages and thumbnails
        run: python scripts/sync_official_catalogs.py
      - name: Commit updated catalog index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-catalog.json vision/catalog-images
          if git diff --cached --quiet; then
            echo "No visual catalog changes."
          else
            git commit -m "Refresh official visual decor catalog"
            git pull --rebase origin main
            git push
          fi
