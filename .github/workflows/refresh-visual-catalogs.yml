name: Refresh official visual decor catalogs
on:
  workflow_dispatch:
  schedule:
    # GitHub cron has no exact "every 4 days"; check daily and run only when due.
    - cron: "20 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_official_catalogs.py"
      - ".github/workflows/refresh-visual-catalogs.yml"
permissions:
  contents: write
concurrency:
  group: refresh-visual-catalogs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check four-day interval
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct -- visual-catalog-meta.json 2>/dev/null || true)
          now=$(date +%s)
          if [ -z "$last" ] || [ $((now - last)) -ge 345600 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Last catalog refresh was less than four days ago; skipping."
          fi
      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog tools
        if: steps.cadence.outputs.run == 'true'
        run: pip install requests beautifulsoup4 pillow
      - name: Sync official decor pages and thumbnails
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/sync_official_catalogs.py
      - name: Record refresh time
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, datetime
          p = "visual-catalog-meta.json"
          data = {
            "last_successful_refresh": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
            "interval_days": 4,
            "schedule_note": "Daily GitHub Actions check; catalog sync runs only when four days have elapsed."
          }
          open(p, "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2) + chr(10))
          PY
      - name: Commit updated catalog index
        if: steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-catalog.json vision/catalog-images visual-catalog-meta.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Refresh official visual decor catalog"
            git pull --rebase origin main
            git push
          fi
