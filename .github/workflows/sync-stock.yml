name: Sync UralPlit public stock data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync_stock.py"
      - ".github/workflows/sync-stock.yml"

permissions:
  contents: write

concurrency:
  group: uralplit-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl public UralPlit catalog and validate completeness
        run: python scripts/sync_stock.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("stock-data.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          products = d.get("products")
          assert isinstance(products, list) and len(products) >= 880, f"Unexpected product count: {len(products) if isinstance(products, list) else 'missing'}"
          assert d.get("errors_count", 1) == 0, f"Crawl errors: {d.get('errors_count')}"
          articles = [x.get("article") for x in products]
          assert all(articles), "Missing article numbers"
          assert len(set(articles)) == len(articles), "Duplicate article numbers"
          assert all(x.get("url") and x.get("stock_m") is not None for x in products), "Missing product URL or stock value"
          print(f"Validated {len(products)} products across {d.get('pages_checked')} catalog pages.")
          PY
      - name: Commit verified stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-data.json
          if git diff --cached --quiet; then
            echo "Stock data unchanged; no commit needed."
          else
            git commit -m "Refresh verified public stock data"
            git push origin HEAD:main
          fi
